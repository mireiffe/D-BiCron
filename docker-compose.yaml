# pg2ch — Airflow 3.2.2 (LocalExecutor) 로컬/단일노드 구동용 compose.
#
# Airflow 공식 3.x docker-compose 템플릿을 LocalExecutor 로 단순화한 것
# (Celery worker / redis / flower 제거). 패치 버전별 세부는 공식 템플릿과
# 대조해 조정할 수 있다: https://airflow.apache.org/docs/apache-airflow/3.2.2/howto/docker-compose/
#
# 사용:
#   cp .env.example .env           # PG_PASSWORD 등 채우기, AIRFLOW_UID=$(id -u)
#   cp config/connections.example.json config/connections.json   # 접속정보 작성
#   cp config/tables/orders.example.yaml config/tables/orders.yaml
#   docker compose build
#   docker compose up -d
#   # UI: http://localhost:8080  (admin / admin)

x-airflow-common: &airflow-common
  build:
    context: .
    # 사내 사설 패키지 저장소(미러)를 빌드에 전달 (.env 에서 값을 채운다).
    # 비어 있으면 Dockerfile 의 ARG 기본값(빈 값)이 적용되어 공용 PyPI 를 탄다.
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-}
      PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
      UV_INDEX_URL: ${UV_INDEX_URL:-}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-}
  image: pg2ch-airflow:3.2.2
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    # api-server ↔ scheduler ↔ task 실행 API 의 JWT 서명에 쓰는 공유 시크릿.
    # 모든 컨테이너가 같은 값을 써야 한다 — 값이 갈리면 실행 API 호출마다
    # InvalidSignatureError 가 반복된다. 값을 바꿀 땐 부분 재시작 말고 전체
    # 재생성: `docker compose down && docker compose up -d`.
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-pg2ch-dev-secret-change-me}
    # connection/variable 암호화 키(Fernet). 비워 두면 비암호화로 저장되고,
    # 키를 바꾸면 기존 암호값을 복호화할 수 없다. .env 의 FERNET_KEY 로 고정한다.
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:-}
    # [개발 전용] Airflow 3.x SimpleAuthManager 인증 우회(로그인 없이 전원 admin).
    # 기본 false(보안). 로컬에서만 .env 에 AIRFLOW_ALL_ADMINS=true 로 명시적 opt-in 한다.
    # 공유/운영 환경에서는 절대 true 로 두지 말 것 — 운영은 README 의 로그인 섹션 참조.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: ${AIRFLOW_ALL_ADMINS:-false}
    # pg2ch 설정 경로 (컨테이너 내부)
    PG2CH_CONNECTIONS: /opt/airflow/config/connections.json
    PG2CH_TABLES_DIR: /opt/airflow/config/tables
    # 동시 실행 copy task 수 상한 = pg2ch_copy pool 슬롯 수.
    # 0/unlimited 이면 pool 미사용(무제한). 워커 메모리/OOM 제어용.
    PG2CH_COPY_CONCURRENCY: ${PG2CH_COPY_CONCURRENCY:-8}
    PG_PASSWORD: ${PG_PASSWORD:-}
    CH_PASSWORD: ${CH_PASSWORD:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./config:/opt/airflow/config
    - ./sql:/opt/airflow/sql
    - ./plugins:/opt/airflow/plugins
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # 볼륨 권한 정리(root 로 실행) + DB 마이그레이션 후 종료.
  # bind-mount 된 logs/plugins 를 컨테이너 사용자(AIRFLOW_UID)가 쓸 수 있게 chown 한다
  # → dag-processor 의 "*.log 파일 없음" 권한 에러를 해결.
  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins /opt/airflow/config /opt/airflow/sql
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/plugins
        exec /entrypoint airflow db migrate
    restart: on-failure

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # 로컬 테스트용 ClickHouse (실제 운영에서는 connections.json 을 외부 CH 로 향하게 한다).
  # 기본 `docker compose up` 에선 뜨지 않는다(외부 CH 사용 가정, 부팅 경량화).
  # 로컬 테스트 시에만: docker compose --profile local-ch up -d
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["local-ch"]
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: always

volumes:
  postgres-db:
  clickhouse-data:
