[project]
name = "pg2ch"
version = "0.1.0"
description = "PostgreSQL → ClickHouse 복사 전용 파이프라인 (Airflow 3.2.2)"
requires-python = ">=3.11"
dependencies = [
    "psycopg2-binary>=2.9,<3",
    "clickhouse-driver>=0.2,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
# Airflow 는 컨테이너 base image(apache/airflow:3.2.2)가 제공하므로 런타임 의존성에 넣지 않는다.
# 로컬에서 DAG 파싱까지 검증하고 싶을 때만 설치한다.
airflow = ["apache-airflow==3.2.2"]
test = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6"]

[project.scripts]
pg2ch = "pg2ch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires live PostgreSQL / ClickHouse connections",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg2ch"]
