# append 모드 예시: 주기적으로 새 row 가 쌓이는 테이블.
#   updated_at watermark 이후의 변경분만 증분 전송한다.
#   ReplacingMergeTree + overlap 으로 재전송 중복을 merge 시 자동 제거.
# 사용하려면 orders.yaml 로 복사해 값을 맞춘다.

table_id: orders                 # 고유 ID → DAG id(pg2ch_orders) + 추적 키
source: my_postgres              # connections.json 의 ID
target: my_clickhouse
meta: meta

sync_mode: append
schedule: "*/15 * * * *"         # 15분마다
start_date: "2026-01-01"
tags: [pg2ch, shop]

source_table: public.orders
target_table: default.orders

# 증분 기준
watermark_column: updated_at     # 이 컬럼 > 마지막 watermark 인 row 만 전송
watermark_type: timestamp        # serial | numeric | timestamp (컬럼 지정 시 필수)
sync_since: 90d                  # watermark 하한 — timestamp: "90d"|ISO, serial/numeric: 숫자
watermark_overlap: 30m           # watermark 를 30분 앞당겨 재전송(누락 방지, dedup 처리)
                                 #   timestamp: "30m"/"12h"/"1d", serial/numeric: 숫자

# DDL (대상 테이블이 없으면 이 정의대로 생성)
engine: ReplacingMergeTree(updated_at)
order_by: [id]
primary_key: [id]
partition_by: toYYYYMM(created_at)
indexes:
  - name: idx_status
    column: status
    type: set(1000)
    granularity: 1
settings:
  index_granularity: 8192

# 컬럼 처리
drop_columns: [internal_note, debug_payload]
column_overrides:
  status: LowCardinality(String)
  country: LowCardinality(String)
  amount: Decimal(18,4)
  item_ids:                      # PG text "1,2,3" → CH [1, 2, 3]
    type: Array(Int16)           # Array(Int*) / Array(UInt*) 지원
    delimiter: ","               # 항목 trim; NULL/빈 문자열 → []
use_nullable: false

# 배치 / 에러 처리
batch_size: 50000
insert_types_check: true          # 안정화 후 false 로 두면 INSERT CPU 비용 감소 가능
on_row_error: dead_letter        # 실패 row 는 copy_failed_row 에 보관
max_failed_rows: 1000            # 누적 실패가 이 수를 넘으면 run 실패 처리

# 적재 직후 즉시 dedup
optimize_after_sync: true
optimize_partitions: ["202606"]
optimize_mutations_sync: 2

# 무결성 검사 + 누락 row 자가복구 (append 전용)
#   최근 watermark 구간 (watermark_before, watermark_after] 에서 PG source 의 row 수와
#   CH target 의 distinct watermark 수를 비교한다. 누락이 잡히면 그 watermark 값의 row 만
#   골라 다시 복사하고(self-heal), 그래도 남으면 retention 을 막아 source 유실을 방지한다.
#   검사 해상도는 watermark 값 단위 — serial/증가 id 처럼 unique 한 watermark 에서 정밀하다.
#   retention DAG 도 삭제 직전에 같은 검사를 게이트로 쓰므로, retention 대상 테이블이라면
#   켜는 것을 권장.
integrity:
  enabled: false                 # true 로 켜야 검사 실행
  method: count                  # count(값싼 게이트+누락분만 diff) | key_diff(항상 정밀)
  lookback_runs: 1               # 최근 몇 개 run 구간을 검사할지
  repair: true                   # 누락 row 재복사(self-heal); ReplacingMergeTree 계열만 동작
  repair_attempts: 1             # 재복사→재검사 최대 반복 횟수
  on_mismatch: fail              # (repair 후에도 누락 시) fail = retention 차단 | warn = 로그만
  tolerance: 0                   # 허용 누락 수 (이보다 크면 mismatch)
  # 파티션 프루닝(선택): watermark 가 파티션 키가 아니면 CH 가 window 질의에 파티션을
  # 못 쳐내 uniqExact 가 메모리를 초과할 수 있다. 파티션 ts 컬럼 + 기간을 주면 양쪽
  # 질의에 `col >= now-period` 를 동일하게 걸어 최근 파티션만 스캔한다.
  #   ⚠️ 검사 범위가 그 기간으로 한정된다. 이 테이블은 watermark=updated_at 이고
  #   partition=created_at 이라, 오래 전에 만들어졌지만 최근 갱신된(=updated_at 최근,
  #   created_at 과거) row 는 검사에서 빠질 수 있다. 파티션 컬럼이 watermark 와 함께
  #   증가하는 append-only 성격일 때만 안전하다.
  # partition_column: created_at
  # partition_period: 90d          # "30d"/"12h" 상대 또는 ISO 절대

# PG source retention(오래된 source row 삭제)은 테이블 설정이 아니라
# config/retention.yaml 에서 관리한다 — copy 와 분리된 전용 DAG 로 돈다.
# (config/retention.example.yaml 참조)          # lock 대기 제한
