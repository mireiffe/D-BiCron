# full_reload 모드 예시: 주기적으로 truncate 후 전체를 다시 쌓는 테이블.
#   매 실행마다 target 을 TRUNCATE 하고 source 전체를 다시 적재한다.
#   watermark 를 쓰지 않으므로 "어디까지" 추적은 run 단위(전량)로만 의미를 가진다.
# 사용하려면 price_book.yaml 로 복사해 값을 맞춘다.

table_id: price_book
source: my_postgres
target: my_clickhouse
meta: meta

sync_mode: full_reload
schedule: "0 4 * * *"            # 매일 04:00 (source 가 새벽에 통째로 갱신된다고 가정)
start_date: "2026-01-01"
tags: [pg2ch, reference]

source_table: public.price_book
target_table: default.price_book

# full_reload 는 watermark 가 필요 없다. (정렬용으로만 timestamp_column 사용 가능)
timestamp_column: refreshed_at

engine: MergeTree
order_by: [sku]
partition_by: ""                 # 작은 참조 테이블 → 파티션 없음

column_overrides:
  currency: LowCardinality(String)
  price: Decimal(18,4)
use_nullable: false

batch_size: 100000
on_row_error: dead_letter
